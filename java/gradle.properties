# Resolve the API and the annotation processor from the local publish.
#
# The build plugin defaults to JitPack's coordinates, which is what an author
# wants and what this file undoes: the event API used here is written and not
# tagged, so it exists only under the group gocraft-jvm declares. Delete this
# line when it is released — with it gone, the build asks for the published
# artefacts and proves they are enough.
gocraft.artefactGroup=fr.gocraft