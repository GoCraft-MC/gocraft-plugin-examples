# The Go reference plugin.
#
# A Go plugin is a compiled binary and its own host, so `entry` names an
# executable under payload/ rather than a class. The command tree is not written
# here: it is declared as code, dumped with -gocraft-dump-commands, and handed
# to `gocraft-cli build -commands`. Nothing compiles a hand-authored TOML tree.

id = "gocraft.example.go"
version = "0.1.0"
api = 1
runtime = "go"
entry = "bin/gocraft-example-go"

[[subscribe]]
event = "player.join"

# Resolved by the host before every dispatch and shipped inside the event, so
# event.Can(...) is a map lookup rather than a round trip taken while the tick
# waits. A node not declared here reads false — a manifest bug, not a denial.
[[subscribe]]
event = "block.break"
perms = ["gocraft.example.mine"]

# Last, and only to watch: this one discounts a purchase somebody else
# announced, so it should see what every other subscriber decided first.
[[subscribe]]
event = "gocraft.example/purchase"
priority = "monitor"

[commands]
tree = "commands.pb"

# The event this plugin defines, and the half of the pair that starts in Go.
#
# Written by hand because a Go plugin has no annotation processor to derive it
# from: nothing compiles a struct into a manifest the way gocraft-apt compiles a
# class. So this is the description, and `gocraft-cli gen` turns it back into
# the Go types this plugin emits through — one description still, read twice.
[[events.provides]]
type = "gocraft.example/greeting"
fields = [
  { name = "player", type = "PlayerRef" },
  { name = "message", type = "string", mutable = true },
]
